<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS Hub - Events Board</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .event-details {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }
        .event-stat {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
            padding: 0.3rem 0;
            font-size: 0.9rem;
        }
        .event-stat:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: var(--text-secondary);
            font-weight: 600;
        }
        .stat-value {
            color: var(--text-primary);
        }
        .delete-btn {
            background: rgba(248, 113, 113, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
        }
        .delete-btn:hover {
            background: var(--danger);
            color: #fff;
        }
        /* Grid specifically for the event admin form */
        .event-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">RDS HUB</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="cars.html">Cars</a></li>
            <li><a href="events.html" class="active">Events</a></li>
            <li><a href="market.html">Market</a></li>
            <li id="logout-nav" class="admin-only"><a href="#" id="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Live Events & Modes</h1>
        <p class="page-subtitle">Check active multiplayer sessions, track requirements, and event rules.</p>

        <!-- Admin Control Panel (Hidden by Default) -->
        <div id="admin-dashboard" class="glass-panel admin-panel admin-only">
            <h2 style="margin-bottom: 1rem; color: var(--accent-purple);">Admin: Create New Event</h2>
            <form id="add-event-form">
                
                <div class="form-group">
                    <label>Event Image URL (Optional)</label>
                    <input type="text" id="ev-image" class="glass-input" placeholder="https://...">
                </div>

                <div class="event-form-grid">
                    <div class="form-group"><label>Event Title / Name</label><input type="text" id="ev-title" class="glass-input" required placeholder="e.g. Weekend Rally"></div>
                    <div class="form-group"><label>Game Mode</label><input type="text" id="ev-gamemode" class="glass-input" placeholder="e.g. Grind"></div>
                    <div class="form-group"><label>Track</label><input type="text" id="ev-track" class="glass-input" placeholder="e.g. Off-road Trials"></div>
                    <div class="form-group"><label>Location</label><input type="text" id="ev-location" class="glass-input" placeholder="e.g. Mountain Map"></div>
                    
                    <div class="form-group"><label>Duration</label><input type="text" id="ev-duration" class="glass-input" placeholder="e.g. 6 Hour(s)"></div>
                    <div class="form-group"><label>Required Car</label><input type="text" id="ev-car" class="glass-input" placeholder="e.g. Personal"></div>
                    <div class="form-group"><label>Stage Limit</label><input type="text" id="ev-stage" class="glass-input" placeholder="e.g. Stage 3 Max"></div>
                    <div class="form-group"><label>Fuel</label><input type="text" id="ev-fuel" class="glass-input" placeholder="e.g. Unlimited"></div>
                    
                    <div class="form-group">
                        <label>Trade</label>
                        <select id="ev-trade" class="glass-input">
                            <option value="Enabled">Enabled</option>
                            <option value="Disabled">Disabled</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Mode</label>
                        <select id="ev-mode" class="glass-input">
                            <option value="On">On</option>
                            <option value="Off">Off</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Character</label>
                        <select id="ev-character" class="glass-input">
                            <option value="On">On</option>
                            <option value="Off">Off</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 1rem;">Publish Event</button>
            </form>
        </div>

        <!-- The Event Display Grid -->
        <div id="event-grid" class="card-grid">
            <!-- Events will be injected here by Javascript -->
            <p style="text-align: center; width: 100%; color: var(--text-muted);">Loading events...</p>
        </div>
    </div>

    <script type="module">
        import { 
            db, auth, collection, addDoc, onSnapshot, doc, deleteDoc, onAuthStateChanged, signOut 
        } from './js/firebase-config.js';

        let isAdmin = false;

        // 1. Check Admin Status
        onAuthStateChanged(auth, (user) => {
            if (user) {
                isAdmin = true;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            } else {
                isAdmin = false;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            }
            renderEvents(); 
        });

        // 2. Logout Logic
        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            signOut(auth).then(() => window.location.reload());
        });

        // 3. Real-time Firebase Listener for Events
        let eventsData = [];
        const eventsCollection = collection(db, 'events');
        
        onSnapshot(eventsCollection, (snapshot) => {
            eventsData = [];
            snapshot.forEach((doc) => {
                eventsData.push({ id: doc.id, ...doc.data() });
            });
            renderEvents();
        });

        // 4. Render Events to the DOM
        function renderEvents() {
            const grid = document.getElementById('event-grid');
            grid.innerHTML = '';

            if (eventsData.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">No active events right now.</p>';
                return;
            }

            eventsData.forEach(ev => {
                const card = document.createElement('div');
                card.className = 'glass-panel';
                
                let imageHTML = ev.image ? `<img src="${ev.image}" class="car-card-img" alt="Event Image" style="height:150px;">` : '';
                let adminTools = isAdmin ? `<button class="delete-btn" onclick="deleteEvent('${ev.id}')">End / Delete Event</button>` : '';

                card.innerHTML = `
                    ${imageHTML}
                    <h3 style="font-size: 1.3rem; color: var(--accent-cyan); margin-bottom: 0.5rem;">${ev.title}</h3>
                    
                    <div class="event-details">
                        <div class="event-stat"><span class="stat-label">Game Mode:</span> <span class="stat-value">${ev.gamemode || '-'}</span></div>
                        <div class="event-stat"><span class="stat-label">Track:</span> <span class="stat-value">${ev.track || '-'}</span></div>
                        <div class="event-stat"><span class="stat-label">Location:</span> <span class="stat-value">${ev.location || '-'}</span></div>
                        <div class="event-stat"><span class="stat-label">Duration:</span> <span class="stat-value">${ev.duration || '-'}</span></div>
                        <div class="event-stat"><span class="stat-label">Car:</span> <span class="stat-value">${ev.car || '-'}</span></div>
                        <div class="event-stat"><span class="stat-label">Stage Limit:</span> <span class="stat-value">${ev.stage || '-'}</span></div>
                        <div class="event-stat"><span class="stat-label">Trade:</span> <span class="stat-value" style="color: ${ev.trade === 'Enabled' ? 'var(--accent-green)' : 'var(--danger)'};">${ev.trade || '-'}</span></div>
                        <div class="event-stat"><span class="stat-label">Fuel:</span> <span class="stat-value">${ev.fuel || '-'}</span></div>
                        <div class="event-stat"><span class="stat-label">Mode:</span> <span class="stat-value">${ev.mode || '-'}</span></div>
                        <div class="event-stat"><span class="stat-label">Character:</span> <span class="stat-value">${ev.character || '-'}</span></div>
                    </div>

                    ${adminTools}
                `;
                grid.appendChild(card);
            });
        }

        // 5. Add New Event to Firebase
        document.getElementById('add-event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const evData = {
                title: document.getElementById('ev-title').value,
                image: document.getElementById('ev-image').value,
                gamemode: document.getElementById('ev-gamemode').value,
                track: document.getElementById('ev-track').value,
                location: document.getElementById('ev-location').value,
                duration: document.getElementById('ev-duration').value,
                car: document.getElementById('ev-car').value,
                stage: document.getElementById('ev-stage').value,
                fuel: document.getElementById('ev-fuel').value,
                trade: document.getElementById('ev-trade').value,
                mode: document.getElementById('ev-mode').value,
                character: document.getElementById('ev-character').value,
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, 'events'), evData);
                document.getElementById('add-event-form').reset();
            } catch (error) {
                console.error("Error adding event: ", error);
                alert("Failed to add event. Ensure you are logged in as admin.");
            }
        });

        // 6. Delete Event Function
        window.deleteEvent = async function(id) {
            if(confirm("Are you sure you want to end and delete this event?")) {
                await deleteDoc(doc(db, 'events', id));
            }
        };
    </script>
</body>
</html>
