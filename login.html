<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Portal - Secure Access</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #3b82f6;
            --danger: #ef4444;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
        }
        .auth-container {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .sleek-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }
        .sleek-input:focus {
            border-color: var(--accent);
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
            margin-top: 1rem;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        #error-message {
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="header">
            <h2 style="margin:0 0 0.5rem 0;">System Terminal</h2>
            <p style="margin:0; font-size:0.9rem; color:var(--text-muted);">Firebase Encrypted Login</p>
        </div>

        <form id="owner-login">
            <div class="input-group">
                <label>Administrator Email</label>
                <input type="email" id="admin-email" class="sleek-input" required placeholder="admin@domain.com">
            </div>
            
            <div class="input-group">
                <label>Access Passphrase</label>
                <input type="password" id="admin-password" class="sleek-input" required placeholder="••••••••••••">
            </div>
            
            <div id="error-message">Invalid credentials. Access denied.</div>
            
            <button type="submit" class="btn btn-primary">Authenticate</button>
        </form>
    </div>

    <!-- Connect to Firebase to securely check the password -->
    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './js/firebase-config.js';

        const loginForm = document.getElementById('owner-login');
        const errorDiv = document.getElementById('error-message');

        // If already logged in, send them straight to the dashboard
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html'; 
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';

            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            try {
                // Firebase checks the password securely on its servers
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch (error) {
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
