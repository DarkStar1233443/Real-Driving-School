<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS Hub | Secure Access</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        :root {
            --bg-main: #050505; --bg-card: #121212; --border: #262626;
            --text-primary: #f5f5f5; --text-secondary: #a3a3a3;
            --accent: #3b82f6; --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .auth-card { background-color: var(--bg-card); border: 1px solid var(--border); padding: 3rem; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .auth-card h2 { margin-bottom: 0.5rem; font-weight: 800; font-size: 1.5rem; text-align: center; }
        .auth-card p { color: var(--text-secondary); font-size: 0.9rem; text-align: center; margin-bottom: 2rem; }
        
        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
        .input-field { width: 100%; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-primary); padding: 0.8rem; border-radius: 8px; outline: none; transition: border 0.2s; }
        .input-field:focus { border-color: var(--accent); }
        
        .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 0.9rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; margin-top: 1rem; }
        .btn-submit:hover { opacity: 0.9; }
        
        #error-msg { color: var(--danger); font-size: 0.85rem; text-align: center; margin-top: 1rem; display: none; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>System Terminal</h2>
        <p>Restricted access for authorized personnel only.</p>
        
        <form id="login-form">
            <div class="input-group">
                <label>Admin Email</label>
                <input type="email" id="email" class="input-field" required placeholder="admin@darkstar.com">
            </div>
            <div class="input-group">
                <label>Passphrase</label>
                <input type="password" id="password" class="input-field" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Authenticate</button>
            <div id="error-msg">Invalid credentials or system error.</div>
        </form>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './js/firebase-config.js';

        // Redirect if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'admin.html';
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = 'admin.html';
            } catch (error) {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
