<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Portal - Restricted Access</title>
    <style>
        /* Sleek, dark minimalist UI */
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
        }
        .auth-container {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .sleek-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }
        .sleek-input:focus {
            border-color: var(--accent);
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
            margin-top: 1rem;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        
        /* Device Approval Queue UI */
        .approval-queue {
            margin-top: 2.5rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }
        .device-card {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        .device-info {
            font-size: 0.85rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        .device-info strong {
            color: var(--text-muted);
        }
        .action-row {
            display: flex;
            gap: 0.5rem;
        }
        .btn-accept { 
            background: rgba(16, 185, 129, 0.1); 
            color: var(--success); 
            border: 1px solid var(--success); 
        }
        .btn-reject { 
            background: rgba(239, 68, 68, 0.1); 
            color: var(--danger); 
            border: 1px solid var(--danger); 
        }
        .btn-accept:hover, .btn-reject:hover {
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="header">
            <h2 style="margin:0 0 0.5rem 0;">System Terminal</h2>
            <p style="margin:0; font-size:0.9rem; color:var(--text-muted);">Secure access requires OTP verification.</p>
        </div>

        <!-- The OTP Login Form -->
        <form id="owner-login">
            <div class="input-group">
                <label>System Administrator</label>
                <input type="email" class="sleek-input" value="pennabadicharith@gmail.com" readonly>
            </div>
            
            <div class="input-group">
                <label>6-Digit Authentication Code</label>
                <input type="text" class="sleek-input" placeholder="• • • • • •" maxlength="6" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Verify & Initialize</button>
        </form>

        <!-- The Admin Approval Queue (Would be visible after login) -->
        <div class="approval-queue">
            <h3 style="font-size: 1rem; margin-top:0; color: var(--accent);">Pending Access Requests</h3>
            
            <div class="device-card">
                <div class="device-info">
                    <strong>Alias:</strong> ShadowRacer99<br>
                    <strong>Device Profile:</strong> iPhone 14 Pro, Safari<br>
                    <strong>Connection:</strong> Hyderabad, IN
                </div>
                <div class="action-row">
                    <button class="btn btn-accept">Authorize</button>
                    <button class="btn btn-reject">Deny Access</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
