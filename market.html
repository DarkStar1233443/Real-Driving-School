<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS Hub - Marketplace</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .market-board {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .listing-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem;
            border-left: 4px solid var(--glass-border);
        }
        .listing-type-sell { border-left-color: var(--accent-cyan); }
        .listing-type-buy { border-left-color: var(--accent-purple); }
        
        .listing-info {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .listing-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        /* In-Development Overlay for Auctions */
        .dev-overlay-container {
            position: relative;
            margin-top: 3rem;
            opacity: 0.6;
            pointer-events: none;
            filter: grayscale(100%);
        }
        .dev-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: var(--accent-gold);
            padding: 1rem 2rem;
            border-radius: 8px;
            border: 1px solid var(--accent-gold);
            font-size: 1.5rem;
            font-weight: 800;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .delete-btn {
            background: rgba(248, 113, 113, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .delete-btn:hover { background: var(--danger); color: #fff; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">RDS HUB</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="cars.html">Cars</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="market.html" class="active">Market</a></li>
            <li id="logout-nav" class="admin-only"><a href="#" id="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Community Marketplace</h1>
        <p class="page-subtitle">Buy, sell, and trade vehicles and items.</p>

        <!-- Admin Control Panel (Hidden by Default) -->
        <div id="admin-dashboard" class="glass-panel admin-panel admin-only">
            <h2 style="margin-bottom: 1rem; color: var(--accent-purple);">Admin: Add Listing</h2>
            <form id="add-listing-form">
                <div class="form-group">
                    <label>Listing Type</label>
                    <select id="list-type" class="glass-input">
                        <option value="Selling">Selling (WTS)</option>
                        <option value="Buying">Buying (WTB)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Item Name / Car</label>
                    <input type="text" id="list-item" class="glass-input" required placeholder="e.g. Stage 4 Cop Car">
                </div>

                <div class="form-group">
                    <label>Price / Offer</label>
                    <input type="text" id="list-price" class="glass-input" required placeholder="e.g. 15m or Trades">
                </div>

                <div class="form-group">
                    <label>Seller/Buyer Username</label>
                    <input type="text" id="list-user" class="glass-input" required placeholder="Player Name">
                </div>

                <div class="form-group">
                    <label>Tags (Select all that apply)</label>
                    <div style="display:flex; gap:1rem; margin-top:0.5rem;">
                        <label><input type="checkbox" id="tag-cop" value="Cop"> Cop</label>
                        <label><input type="checkbox" id="tag-rb" value="Rb"> Rainbow</label>
                        <label><input type="checkbox" id="tag-prem" value="Prem"> Premium</label>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 1rem;">Post Listing</button>
            </form>
        </div>

        <!-- Trading Board -->
        <div class="glass-panel">
            <h2 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">Active Listings</h2>
            <div id="market-grid" class="market-board">
                <!-- Listings injected here -->
                <p style="text-align: center; color: var(--text-muted);">Loading market data...</p>
            </div>
        </div>

        <!-- Auctions (In Development) -->
        <div class="dev-overlay-container glass-panel">
            <div class="dev-badge">🛠️ Auctions In Development</div>
            <h2 style="margin-bottom: 1rem;">Live Auctions</h2>
            <div style="display:flex; justify-content:space-between; border: 1px solid var(--glass-border); padding: 1rem; border-radius: 8px;">
                <div>
                    <h3 style="color: var(--accent-cyan);">Mystery Premium Car</h3>
                    <p style="color: var(--text-secondary);">Current Bid: 50m</p>
                </div>
                <div style="text-align:right;">
                    <p style="color: var(--danger); font-weight:bold;">Ends In: 04:32:10</p>
                    <button class="btn-primary" style="opacity:0.5; margin-top:0.5rem;">Place Bid</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { 
            db, auth, collection, addDoc, onSnapshot, doc, deleteDoc, onAuthStateChanged, signOut 
        } from './js/firebase-config.js';

        let isAdmin = false;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                isAdmin = true;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            } else {
                isAdmin = false;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
            }
            renderListings(); 
        });

        const logoutBtn = document.getElementById('logout-btn');
        if(logoutBtn) {
            logoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                signOut(auth).then(() => window.location.reload());
            });
        }

        let marketData = [];
        const marketCollection = collection(db, 'market');
        
        onSnapshot(marketCollection, (snapshot) => {
            marketData = [];
            snapshot.forEach((doc) => {
                marketData.push({ id: doc.id, ...doc.data() });
            });
            renderListings();
        });

        function renderListings() {
            const grid = document.getElementById('market-grid');
            grid.innerHTML = '';

            if (marketData.length === 0) {
                grid.innerHTML = '<p style="text-align:center;">No active listings.</p>';
                return;
            }

            marketData.forEach(item => {
                const listing = document.createElement('div');
                listing.className = `glass-panel listing-card ${item.type === 'Selling' ? 'listing-type-sell' : 'listing-type-buy'}`;
                
                let tagsHTML = '';
                if(item.tags && item.tags.length > 0) {
                    item.tags.forEach(tag => {
                        let badgeClass = '';
                        if(tag === 'Cop') badgeClass = 'badge-cop';
                        if(tag === 'Rb') badgeClass = 'badge-rb';
                        if(tag === 'Prem') badgeClass = 'badge-prem';
                        tagsHTML += `<span class="badge ${badgeClass}">${tag}</span>`;
                    });
                }

                let adminTools = isAdmin ? `<button class="delete-btn" onclick="deleteListing('${item.id}')">Remove</button>` : '';
                let typeColor = item.type === 'Selling' ? 'var(--accent-cyan)' : 'var(--accent-purple)';

                listing.innerHTML = `
                    <div class="listing-info">
                        <div style="font-size: 0.8rem; font-weight:bold; text-transform:uppercase; color: ${typeColor};">[${item.type}] by ${item.user}</div>
                        <h3 style="font-size: 1.2rem;">${item.item}</h3>
                        <div style="color: var(--accent-green); font-weight: bold;">Price/Offer: ${item.price}</div>
                        <div class="listing-tags">${tagsHTML}</div>
                    </div>
                    ${adminTools}
                `;
                grid.appendChild(listing);
            });
        }

        document.getElementById('add-listing-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const tags = [];
            if(document.getElementById('tag-cop').checked) tags.push('Cop');
            if(document.getElementById('tag-rb').checked) tags.push('Rb');
            if(document.getElementById('tag-prem').checked) tags.push('Prem');

            const listData = {
                type: document.getElementById('list-type').value,
                item: document.getElementById('list-item').value,
                price: document.getElementById('list-price').value,
                user: document.getElementById('list-user').value,
                tags: tags,
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, 'market'), listData);
                document.getElementById('add-listing-form').reset();
            } catch (error) {
                console.error("Error adding listing: ", error);
                alert("Failed to add listing.");
            }
        });

        window.deleteListing = async function(id) {
            if(confirm("Remove this listing?")) {
                await deleteDoc(doc(db, 'market', id));
            }
        };
    </script>
</body>
</html>
