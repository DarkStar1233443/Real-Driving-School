<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS Hub | Public Database</title>
    <style>
        /* Premium Dark Theme UI */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        
        :root {
            --bg-main: #050505;
            --bg-sidebar: #0a0a0a;
            --bg-card: #121212;
            --border: #262626;
            --text-primary: #f5f5f5;
            --text-secondary: #a3a3a3;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Navigation */
        .sidebar { width: 280px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 2rem; display: flex; flex-direction: column; }
        .logo { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.05em; margin-bottom: 3rem; }
        .logo span { color: var(--accent); }
        
        .nav-link { display: flex; align-items: center; gap: 1rem; padding: 1rem; color: var(--text-secondary); text-decoration: none; border-radius: 8px; font-weight: 500; transition: all 0.2s ease; cursor: pointer; margin-bottom: 0.5rem; }
        .nav-link:hover { background-color: var(--border); color: var(--text-primary); }
        .nav-link.active { background-color: rgba(59, 130, 246, 0.1); color: var(--accent); border: 1px solid rgba(59, 130, 246, 0.2); }
        
        .admin-gateway { margin-top: auto; text-align: center; font-size: 0.85rem; color: #404040; text-decoration: none; transition: color 0.2s; }
        .admin-gateway:hover { color: var(--text-secondary); }

        /* Main Content */
        .main-content { flex: 1; padding: 3rem; overflow-y: auto; scroll-behavior: smooth; }
        .header { margin-bottom: 3rem; }
        .header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
        .header p { color: var(--text-secondary); font-size: 1.1rem; }

        /* Content Sections */
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Data Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; transition: transform 0.2s, border-color 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #404040; }
        .card h3 { margin-bottom: 0.5rem; font-size: 1.25rem; }
        .card p { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; }
        
        .loading { color: var(--accent); font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">RDS <span>HUB</span></div>
        <div class="nav-link active" onclick="switchTab('cars', this)">
            🏎️ Vehicle Database
        </div>
        <div class="nav-link" onclick="switchTab('events', this)">
            🏁 Live Events
        </div>
        
        <!-- Hidden link to the admin portal -->
        <a href="login.html" class="admin-gateway">Admin Portal</a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        
        <!-- Cars Section -->
        <div id="cars-section" class="section active">
            <div class="header">
                <h1>Vehicle Database</h1>
                <p>Public records of all registered vehicles and stage prices.</p>
            </div>
            <div class="grid" id="cars-grid">
                <div class="loading">Fetching data from Firebase...</div>
            </div>
        </div>

        <!-- Events Section -->
        <div id="events-section" class="section">
            <div class="header">
                <h1>Live Events</h1>
                <p>Current active grinds and multiplayer track rules.</p>
            </div>
            <div class="grid" id="events-grid">
                <div class="loading">Fetching data from Firebase...</div>
            </div>
        </div>

    </main>

    <!-- UI Logic & Database Connection -->
    <script type="module">
        import { db, collection, onSnapshot } from './js/firebase-config.js';

        // Tab Switching Logic
        window.switchTab = function(tabName, element) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(tabName + '-section').classList.add('active');
            element.classList.add('active');
        };

        // Real-time listener for Cars
        onSnapshot(collection(db, 'cars'), (snapshot) => {
            const grid = document.getElementById('cars-grid');
            grid.innerHTML = '';
            if(snapshot.empty) { grid.innerHTML = '<p style="color: #a3a3a3;">No vehicles found in database.</p>'; return; }
            
            snapshot.forEach(doc => {
                const data = doc.data();
                grid.innerHTML += `
                    <div class="card">
                        <h3>${data.name || 'Unknown Vehicle'}</h3>
                        <p><strong>Class:</strong> ${data.class || 'N/A'}</p>
                        <p><strong>Price:</strong> $${data.price || '0'}</p>
                    </div>
                `;
            });
        });

        // Real-time listener for Events
        onSnapshot(collection(db, 'events'), (snapshot) => {
            const grid = document.getElementById('events-grid');
            grid.innerHTML = '';
            if(snapshot.empty) { grid.innerHTML = '<p style="color: #a3a3a3;">No active events.</p>'; return; }
            
            snapshot.forEach(doc => {
                const data = doc.data();
                grid.innerHTML += `
                    <div class="card" style="border-left: 4px solid var(--accent);">
                        <h3>${data.title || 'Special Event'}</h3>
                        <p style="margin-top: 0.5rem;">${data.description || 'Details coming soon.'}</p>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
